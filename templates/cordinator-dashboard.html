<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Coordinator Dashboard — CAMS</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">

</head>

<body>

<div class="bg-mesh"></div>


<nav class="navbar">

  <a href="/" class="navbar-brand">

    <div class="brand-icon">🎓</div>

    CAMS

  </a>

  <ul class="navbar-nav">

    <li>
      <a href="/activities/">
        Activities
      </a>
    </li>

    <li>
      <a href="/submit-activity/">
        Submit Activity
      </a>
    </li>

  </ul>

  <div class="navbar-actions">

    <a
      href="/logout/"
      class="btn btn-danger btn-sm"
    >
      Logout
    </a>

  </div>

</nav>


<main class="page-container">

  <div class="dashboard-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-section">

        <div class="sidebar-section-title">
          Menu
        </div>

        <ul class="sidebar-nav">

          <li>
            <a
              href="/coordinator-dashboard/"
              class="active"
            >
              <span class="nav-icon">📊</span>
              Dashboard
            </a>
          </li>

          <li>
            <a href="/submit-activity/">
              <span class="nav-icon">➕</span>
              New Activity
            </a>
          </li>

          <li>
            <a href="/activities/">
              <span class="nav-icon">📋</span>
              Browse Activities
            </a>
          </li>

          <li>
            <a href="/logout/">
              <span class="nav-icon">🚪</span>
              Logout
            </a>
          </li>

        </ul>

      </div>

    </aside>


    <!-- MAIN -->

    <div class="main-content">

      <!-- HEADER -->

      <div class="page-header animate-fade">

        <div>

          <h1 class="page-title">
            Coordinator Dashboard
          </h1>

          <p
            class="page-subtitle"
            id="welcome-msg"
          >
            Welcome!
          </p>

        </div>

        <div
          style="display:flex;gap:12px"
        >

          <a
            href="/submit-activity/"
            class="btn btn-primary"
          >
            ➕ New Activity
          </a>

        </div>

      </div>


      <!-- STATS -->

      <div
        class="stat-grid grid mb-32"
        id="stats-grid"
      >
      </div>


      <!-- ACTIVITIES -->

      <div class="card animate-slide mb-24">

        <div class="card-header">

          <div class="card-title">

            <div
              class="icon"
              style="background:rgba(59,130,246,.15)"
            >
              📋
            </div>

            My Activities

          </div>

        </div>


        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>Title</th>

                <th>Category</th>

                <th>Date</th>

                <th>Status</th>

              </tr>

            </thead>

            <tbody id="my-acts-tbody"></tbody>

          </table>

        </div>

      </div>


      <!-- ENROLLMENTS -->

      <div class="card animate-slide">

        <div class="card-header">

          <div class="card-title">

            <div
              class="icon"
              style="background:rgba(16,185,129,.15)"
            >
              🎟️
            </div>

            Enrollments

          </div>

        </div>


        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>Student</th>

                <th>Activity</th>

                <th>Status</th>

              </tr>

            </thead>

            <tbody id="my-enrolls-tbody"></tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

</main>


<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>

<script>

document.addEventListener('DOMContentLoaded', async () => {

    //AUTH.requireAuth(['coordinator']);

    const sess = AUTH.getSession();

    if (!sess) {

        window.location.href = '/login/';
        return;
    }

    document.getElementById('welcome-msg').textContent =
        `Welcome, ${sess.name}!`;

    await renderStats();

    await renderActivities();

    await renderEnrollments();
});


async function renderStats() {

    const activities = await APP.getActivities();

    const enrolls = await APP.getEnrollments();

    const approved = activities.filter(
        a => a.status === 'approved'
    );

    const pending = activities.filter(
        a => a.status === 'pending'
    );

    document.getElementById('stats-grid').innerHTML = `

        <div class="stat-card">

            <div class="stat-value">
                ${activities.length}
            </div>

            <div class="stat-label">
                Activities
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-value">
                ${approved.length}
            </div>

            <div class="stat-label">
                Approved
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-value">
                ${pending.length}
            </div>

            <div class="stat-label">
                Pending
            </div>

        </div>

        <div class="stat-card">

            <div class="stat-value">
                ${enrolls.length}
            </div>

            <div class="stat-label">
                Enrollments
            </div>

        </div>

    `;
}


async function renderActivities() {

    const activities = await APP.getActivities();

    const tb = document.getElementById('my-acts-tbody');

    if (!activities.length) {

        tb.innerHTML = `

            <tr>

                <td colspan="4">

                    No activities yet

                </td>

            </tr>

        `;

        return;
    }

    tb.innerHTML = activities.map(a => `

        <tr>

            <td>${a.title}</td>

            <td>${a.category}</td>

            <td>${a.date}</td>

            <td>

                <span class="badge">

                    ${a.status}

                </span>

            </td>

        </tr>

    `).join('');
}


async function renderEnrollments() {

    const enrolls = await APP.getEnrollments();

    const tb = document.getElementById('my-enrolls-tbody');

    if (!enrolls.length) {

        tb.innerHTML = `

            <tr>

                <td colspan="3">

                    No enrollments yet

                </td>

            </tr>

        `;

        return;
    }

    tb.innerHTML = enrolls.map(e => `

        <tr>

            <td>${e.studentName || 'Student'}</td>

            <td>${e.activityTitle}</td>

            <td>

                <span class="badge">

                    ${e.status}

                </span>

            </td>

        </tr>

    `).join('');
}

</script>

</body>
</html>
