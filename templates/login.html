<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Login — CAMS</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">

<style>

.toast{

    position: fixed;

    top: 25px;
    right: 25px;

    background: rgba(0,0,0,0.75);

    color: white;

    padding: 14px 24px;

    border-radius: 14px;

    font-size: 15px;
    font-weight: 600;

    z-index: 9999;

    opacity: 0;

    visibility: hidden;

    transform: translateX(120px);

    transition: all .4s ease;

    pointer-events: none;
}

.toast.show{

    opacity: 1;

    visibility: visible;

    transform: translateX(0);
}

</style>

</head>

<body>

<div class="bg-mesh"></div>

<nav class="navbar">

    <a href="/" class="navbar-brand">

        <div class="brand-icon">🎓</div>

        CAMS

    </a>

</nav>


<main class="auth-page">

    <div class="auth-card animate-scale">

        <div class="auth-logo">

            <div class="logo-icon">🎓</div>

            <h1>Welcome Back</h1>

            <p>Sign in to your CAMS account</p>

        </div>


        <form id="login-form">

            <div class="form-group">

                <label class="form-label">
                    Email Address
                </label>

                <div class="form-icon-wrap">

                    <span class="field-icon">✉️</span>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="you@college.edu"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label class="form-label">
                    Password
                </label>

                <div class="form-icon-wrap">

                    <span class="field-icon">🔒</span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Your password"
                        required
                    >

                    <span
                        class="field-icon-right"
                        onclick="toggleField('password')"
                    >
                        👁️
                    </span>

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-block btn-lg"
            >
                Sign In
            </button>

        </form>

    </div>

</main>


<!-- TOAST -->

<div id="toast" class="toast">
    ✅ Login Successful
</div>


<script src="{% static 'js/auth.js' %}"></script>


<script>

function toggleField(id){

    const el = document.getElementById(id);

    el.type = el.type === "password"
        ? "text"
        : "password";
}


function showToast(){

    const toast = document.getElementById("toast");

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2000);
}


document.getElementById("login-form").addEventListener("submit", async function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    const result = await AUTH.login(email, password);

    if(result.ok){

        showToast();

        setTimeout(() => {

            const role = result.user.role;

            if(role === "student"){

                window.location.href = "/student-dashboard/";
            }

            else if(role === "coordinator"){

                window.location.href = "/coordinator-dashboard/";
            }

            else{

                window.location.href = "/";
            }

        }, 1200);
    }

    else{

        if(result.errors){

            result.errors.forEach(err => {

                alert(err.msg);

            });
        }
    }
});

</script>

</body>
</html>
