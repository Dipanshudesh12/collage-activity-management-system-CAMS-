<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — CAMS</title>
<meta name="description" content="Login to the College Activity Management System."/>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">
</head>

<body>

<div class="bg-mesh"></div>

<nav class="navbar">

  <a href="/" class="navbar-brand">
    <div class="brand-icon">🎓</div>
    CAMS
  </a>

  <ul class="navbar-nav">
    <li><a href="/">Home</a></li>
    <li><a href="/activities/">Activities</a></li>
  </ul>

  <div class="navbar-actions">
    <a href="/register/" class="btn btn-primary btn-sm">
      Create Account
    </a>
  </div>

</nav>


<main class="auth-page">

  <div class="auth-card animate-scale">

    <div class="auth-logo">
      <div class="logo-icon">🎓</div>

      <h1>Welcome Back</h1>

      <p>Sign in to your CAMS account</p>
    </div>


    <form id="login-form">

      <!-- EMAIL -->

      <div class="form-group">

        <label class="form-label">
          Email Address <span class="required">*</span>
        </label>

        <div class="form-icon-wrap">

          <span class="field-icon">✉️</span>

          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="you@college.edu"
            required
          />

        </div>

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label class="form-label">
          Password <span class="required">*</span>
        </label>

        <div class="form-icon-wrap">

          <span class="field-icon">🔒</span>

          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Your password"
            required
          />

          <span
            class="field-icon-right"
            onclick="toggleField('password')"
          >
            👁️
          </span>

        </div>

      </div>


      <!-- REMEMBER -->

      <div style="display:flex;align-items:center;margin-bottom:20px">

        <label class="form-check" style="margin:0">

          <input type="checkbox" id="remember"/>

          <span class="form-check-label">
            Remember me
          </span>

        </label>

      </div>


      <!-- BUTTON -->

      <button
        type="submit"
        class="btn btn-primary btn-block btn-lg"
      >
        Sign In
      </button>

    </form>


    <div
      class="text-center mt-20"
      style="font-size:.88rem;color:var(--text-muted)"
    >

      Don't have an account?

      <a
        href="/register/"
        style="color:var(--accent-light);font-weight:600"
      >
        Register here
      </a>

    </div>

  </div>

</main>


<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>

<script>

document.addEventListener('DOMContentLoaded', () => {

    

});


function toggleField(id) {

    const el = document.getElementById(id);

    el.type = el.type === 'password'
        ? 'text'
        : 'password';
}


document.getElementById('login-form').addEventListener('submit', async function(e) {

    e.preventDefault();

    const email = document.getElementById('email').value.trim();

    const password = document.getElementById('password').value;

    const result = await AUTH.login(email, password);

    if (result.ok) {

        alert('Login successful!');

        const role = result.user.role;

        if (role === 'student') {

            window.location.href = '/student-dashboard/';
        }

        else if (role === 'coordinator') {

            window.location.href = '/coordinator-dashboard/';
        }

        else {

            window.location.href = '/';
        }
    }

    else {

        if (result.errors) {

            result.errors.forEach(err => {

                alert(err.msg);
            });
        }
    }
});

</script>

</body>
</html>
