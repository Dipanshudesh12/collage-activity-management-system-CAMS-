{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile — CAMS</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">

</head>

<body>

<div class="bg-mesh"></div>

<nav class="navbar">

    <a href="/" class="navbar-brand">

        <div class="brand-icon">🎓</div>

        CAMS

    </a>

</nav>

<main class="auth-page">

    <div class="auth-card">

        <h1 style="margin-bottom:25px">
            ✏ Edit Profile
        </h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="form-group">

                <label class="form-label">
                    Full Name
                </label>

                <input
                  type="text"
                  name="name"
                  class="form-control"
                  value="{{ user.name }}"
                >

            </div>

            <div class="form-group">

                <label class="form-label">
                    Upload Photo
                </label>

                <input
                  type="file"
                  name="photo"
                  class="form-control"
                >

            </div>

            <button
              type="submit"
              class="btn btn-primary btn-block"
            >
                Save Changes
            </button>

        </form>

    </div>

</main>

</body>
</html>
