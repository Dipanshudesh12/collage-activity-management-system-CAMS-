<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Enroll — CAMS</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">

</head>

<body>

<div class="bg-mesh"></div>


<nav class="navbar">

  <a href="/" class="navbar-brand">

    <div class="brand-icon">🎓</div>

    CAMS

  </a>

  <ul class="navbar-nav">

    <li><a href="/">Home</a></li>

    <li><a href="/activities/">Activities</a></li>

    <li><a href="/student-dashboard/">Dashboard</a></li>

  </ul>

  <div class="navbar-actions">

    <a href="/logout/" class="btn btn-danger btn-sm">
      Logout
    </a>

  </div>

</nav>


<main class="page-container">

  <div
    class="container-sm"
    style="padding-top:40px;padding-bottom:60px"
  >

    <!-- SUMMARY -->

    <div
      class="card animate-fade mb-20"
      style="margin-bottom:20px"
    >

      <div
        style="display:flex;align-items:center;gap:12px"
      >

        <div
          style="width:48px;height:48px;background:rgba(124,58,237,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px"
        >
          🎟️
        </div>

        <div>

          <div
            style="font-size:.78rem;color:var(--text-muted)"
          >
            Enrolling For
          </div>

          <div
            style="font-size:1.05rem;font-weight:700"
          >
            {{ activity.title }}
          </div>

          <div
            style="font-size:.8rem;color:var(--text-muted)"
          >
            📅 {{ activity.date }}
            · 📍 {{ activity.venue }}
          </div>

        </div>

      </div>

    </div>


    <!-- HEADER -->

    <div class="page-header animate-fade">

      <div>

        <h1 class="page-title">
          📝 Enrollment Form
        </h1>

        <p class="page-subtitle">
          Complete your registration details
        </p>

      </div>

      <a
        href="/activities/"
        class="btn btn-ghost btn-sm"
      >
        ← Back
      </a>

    </div>


    <!-- FORM -->

    <div class="card animate-slide">

      <form
        method="POST"
        action=""
      >

        {% csrf_token %}

        <!-- PERSONAL -->

        <h3
          style="font-size:1rem;font-weight:700;margin-bottom:16px"
        >
          👤 Personal Information
        </h3>


        <div class="grid-2" style="gap:16px">

          <div class="form-group">

            <label class="form-label">
              Full Name
            </label>

            <input
              type="text"
              class="form-control"
              value="{{ request.session.name }}"
              readonly
            />

          </div>


          <div class="form-group">

            <label class="form-label">
              Student ID
            </label>

            <input
              type="text"
              class="form-control"
              value="{{ request.session.user_id }}"
              readonly
            />

          </div>

        </div>


        <div class="form-group">

          <label class="form-label">
            Activity
          </label>

          <input
            type="text"
            class="form-control"
            value="{{ activity.title }}"
            readonly
          />

        </div>


        <div class="form-group">

          <label class="form-label">
            Venue
          </label>

          <input
            type="text"
            class="form-control"
            value="{{ activity.venue }}"
            readonly
          />

        </div>


        <div class="form-group">

          <label class="form-label">
            Event Date
          </label>

          <input
            type="text"
            class="form-control"
            value="{{ activity.date }}"
            readonly
          />

        </div>


        <!-- CONSENT -->

        <div class="form-group">

          <label class="form-check">

            <input
              type="checkbox"
              required
            />

            <span class="form-check-label">

              I agree to participate in this activity.

            </span>

          </label>

        </div>


        <!-- BUTTONS -->

        <div
          style="display:flex;gap:12px;flex-wrap:wrap"
        >

          <button
            type="submit"
            class="btn btn-primary btn-lg"
            style="flex:1"
          >

            🎟️ Confirm Enrollment

          </button>


          <a
            href="/activities/"
            class="btn btn-ghost btn-lg"
            style="flex:1;text-align:center"
          >

            Cancel

          </a>

        </div>

      </form>

    </div>

  </div>

</main>


<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>

<script>

document.addEventListener('DOMContentLoaded', () => {

    AUTH.requireAuth(['student']);

});

</script>

</body>
</html>
