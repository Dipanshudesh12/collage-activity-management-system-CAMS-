<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Submit Activity — CAMS</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">

</head>

<body>

<div class="bg-mesh"></div>

<nav class="navbar">

  <a href="/" class="navbar-brand">
    <div class="brand-icon">🎓</div>
    CAMS
  </a>

  <ul class="navbar-nav">
    <li><a href="/">Home</a></li>
    <li><a href="/activities/">Activities</a></li>
    <li><a href="/coordinator-dashboard/">Dashboard</a></li>
  </ul>

  <div class="navbar-actions">

    <a href="/logout/" class="btn btn-danger btn-sm">
      Logout
    </a>

  </div>

</nav>


<main class="page-container">

  <div
    class="container-sm"
    style="padding-top:40px;padding-bottom:60px"
  >

    <div class="page-header animate-fade">

      <div>

        <h1 class="page-title">
          ➕ Submit Activity
        </h1>

        <p class="page-subtitle">
          Fill in the details to propose a new activity
        </p>

      </div>

      <a
        href="/coordinator-dashboard/"
        class="btn btn-ghost btn-sm"
      >
        ← Back to Dashboard
      </a>

    </div>


    <div class="card animate-slide">

      <form
        id="activity-form"
        method="POST"
        action="/submit-activity/"
      >

        {% csrf_token %}

        <!-- BASIC -->

        <h3
          style="font-size:1rem;font-weight:700;margin-bottom:16px"
        >
          📌 Basic Information
        </h3>


        <div class="form-group">

          <label class="form-label">
            Activity Title
          </label>

          <input
            type="text"
            class="form-control"
            name="title"
            id="act-title"
            required
          />

        </div>


        <div class="grid-2" style="gap:16px">

          <div class="form-group">

            <label class="form-label">
              Category
            </label>

            <select
              class="form-control"
              name="category"
              id="act-category"
              required
            >

              <option value="">Select</option>

              <option value="sports">
                🏃 Sports
              </option>

              <option value="cultural">
                🎭 Cultural
              </option>

              <option value="technical">
                💻 Technical
              </option>

              <option value="academic">
                📚 Academic
              </option>

            </select>

          </div>


          <div class="form-group">

            <label class="form-label">
              Mode
            </label>

            <select
              class="form-control"
              name="mode"
              id="act-mode"
              required
            >

              <option value="">Select</option>

              <option value="offline">
                🏢 Offline
              </option>

              <option value="online">
                💻 Online
              </option>

              <option value="hybrid">
                🔀 Hybrid
              </option>

            </select>

          </div>

        </div>


        <div class="form-group">

          <label class="form-label">
            Description
          </label>

          <textarea
            class="form-control"
            name="desc"
            id="act-desc"
            rows="4"
            required
          ></textarea>

        </div>


        <!-- DATE -->

        <hr class="section-divider"/>

        <h3
          style="font-size:1rem;font-weight:700;margin-bottom:16px"
        >
          📅 Schedule & Venue
        </h3>


        <div class="grid-2" style="gap:16px">

          <div class="form-group">

            <label class="form-label">
              Event Date
            </label>

            <input
              type="date"
              class="form-control"
              name="date"
              id="act-date"
              required
            />

          </div>


          <div class="form-group">

            <label class="form-label">
              Event Time
            </label>

            <input
              type="time"
              class="form-control"
              name="time"
              id="act-time"
              required
            />

          </div>

        </div>


        <div class="grid-2" style="gap:16px">

          <div class="form-group">

            <label class="form-label">
              Venue
            </label>

            <input
              type="text"
              class="form-control"
              name="venue"
              id="act-venue"
              required
            />

          </div>


          <div class="form-group">

            <label class="form-label">
              Registration Deadline
            </label>

            <input
              type="date"
              class="form-control"
              name="deadline"
              id="act-deadline"
              required
            />

          </div>

        </div>


        <div class="grid-2" style="gap:16px">

          <div class="form-group">

            <label class="form-label">
              Max Participants
            </label>

            <input
              type="number"
              class="form-control"
              name="maxParticipants"
              id="act-max"
              required
            />

          </div>


          <div class="form-group">

            <label class="form-label">
              Contact Email
            </label>

            <input
              type="email"
              class="form-control"
              name="contact"
              id="act-contact"
              required
            />

          </div>

        </div>


        <!-- BUTTONS -->

        <div
          style="display:flex;gap:12px;flex-wrap:wrap"
        >

          <button
            type="submit"
            class="btn btn-primary btn-lg"
            style="flex:1"
          >
            📤 Submit Activity
          </button>

          <button
            type="reset"
            class="btn btn-ghost btn-lg"
            style="flex:1"
          >
            🔄 Reset
          </button>

        </div>

      </form>

    </div>

  </div>

</main>


<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>

<script>

document.addEventListener('DOMContentLoaded', () => {

    AUTH.requireAuth(['coordinator']);

    const sess = AUTH.getSession();

    if (!sess) {

        window.location.href = '/login/';
        return;
    }

    document.getElementById('act-contact').value =
        sess.email || '';
});

</script>

</body>
</html>
