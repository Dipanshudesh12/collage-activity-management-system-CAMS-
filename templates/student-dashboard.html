<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Student Dashboard — CAMS</title>

{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">

</head>

<body style="background:#e0e5ec; min-height:100vh">

<nav class="navbar">

  <a href="/" class="navbar-brand">
    <div class="brand-icon">🎓</div>
    CAMS
  </a>

  <ul class="navbar-nav">
    <li><a href="/activities/">Activities</a></li>
  </ul>

  <div class="navbar-actions">
    <a href="/logout/" class="btn btn-danger btn-sm">
      Logout
    </a>
  </div>

</nav>


<main style="padding-top:0">

  <div class="opt-b-header animate-fade">

    <div class="opt-b-avatar-wrapper" id="banner-avatar">
      👨‍🎓
    </div>

    <h1
      style="font-size:2.2rem;font-weight:800;margin-bottom:8px"
      id="banner-name"
    >
      Loading...
    </h1>

    <p
      style="color:var(--text-secondary);font-size:1.1rem"
      id="banner-dept"
    >
      Student
    </p>

    <div
      style="margin-top:24px;display:flex;justify-content:center;gap:16px"
    >

      <a
        href="/activities/"
        class="btn btn-primary btn-neumorphic"
        style="border-radius:100px;padding:10px 24px"
      >
        📋 Browse Activities
      </a>

      <a
        href="/logout/"
        class="btn btn-danger btn-neumorphic"
        style="border-radius:100px;padding:10px 24px"
      >
        🚪 Logout
      </a>

    </div>

  </div>


  <div class="opt-b-container">

    <!-- STATS -->

    <div
      class="stat-grid grid mb-32"
      id="stats-grid"
    >
    </div>


    <!-- ENROLLMENTS -->

    <div
      class="opt-b-card animate-slide"
      style="padding:0;overflow:hidden"
    >

      <div
        style="padding:32px 32px 16px;display:flex;justify-content:space-between;align-items:center"
      >

        <h3 class="section-title" style="margin:0">
          My Enrollments
        </h3>

      </div>

      <div
        class="table-wrapper"
        style="border:none;box-shadow:none;padding:16px 32px"
      >

        <table style="margin:0">

          <thead style="background:transparent">

            <tr>
              <th>Activity</th>
              <th>Status</th>
            </tr>

          </thead>

          <tbody id="my-enrolls-tbody"></tbody>

        </table>

      </div>

    </div>

  </div>

</main>


<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>

<script>

document.addEventListener('DOMContentLoaded', async () => {

    AUTH.requireAuth(['student']);

    const sess = AUTH.getSession();

    if (!sess) {

        window.location.href = '/login/';
        return;
    }

    document.getElementById('banner-name').textContent = sess.name;

    document.getElementById('banner-dept').textContent =
        (sess.dept || 'Student') + ' · Student';

    const initials = sess.name
        .split(' ')
        .map(w => w[0])
        .join('')
        .substring(0,2)
        .toUpperCase();

    document.getElementById('banner-avatar').textContent = initials;

    await renderStats();

    await renderEnrollments();
});


async function renderStats() {

    const sess = AUTH.getSession();

    const allEnrolls = await APP.getEnrollments();

    const enrolls = allEnrolls.filter(
        e => e.studentId === sess.id
    );

    const activities = await APP.getActivities();

    const approved = activities.filter(
        a => a.status === 'approved'
    );

    document.getElementById('stats-grid').innerHTML = `

        <div class="stat-card">
            <div class="stat-value">${enrolls.length}</div>
            <div class="stat-label">My Enrollments</div>
        </div>

        <div class="stat-card">
            <div class="stat-value">${approved.length}</div>
            <div class="stat-label">Activities</div>
        </div>

    `;
}


async function renderEnrollments() {

    const sess = AUTH.getSession();

    const allEnrolls = await APP.getEnrollments();

    const enrolls = allEnrolls.filter(
        e => e.studentId === sess.id
    );

    const tb = document.getElementById('my-enrolls-tbody');

    if (!enrolls.length) {

        tb.innerHTML = `
            <tr>
                <td colspan="2">
                    No enrollments yet
                </td>
            </tr>
        `;

        return;
    }

    tb.innerHTML = enrolls.map(e => `

        <tr>

            <td>${e.activityTitle}</td>

            <td>
                <span class="badge">
                    ${e.status}
                </span>
            </td>

        </tr>

    `).join('');
}

</script>

</body>
</html>
