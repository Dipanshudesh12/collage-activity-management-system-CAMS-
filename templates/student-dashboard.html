<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Student Dashboard — CAMS</title>
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">
</head>
<body style="background:#e0e5ec; min-height:100vh">

<nav class="navbar">
  <a href="/" class="navbar-brand"><div class="brand-icon">🎓</div>CAMS</a>
  <ul class="navbar-nav"><li><a href="/activities/">Activities</a></li></ul>
  <div class="navbar-actions" id="navbar-user-area"></div>
  <button class="navbar-hamburger" id="hamburger-btn">☰</button>
</nav>

<div class="mobile-drawer-overlay" id="mobile-drawer-overlay"></div>
<div class="mobile-drawer" id="mobile-drawer">
  <ul class="sidebar-nav">
    <li><a href="/dashboard-student/"><span class="nav-icon">📊</span>Dashboard</a></li>
    <li><a href="/activities/"><span class="nav-icon">📋</span>Browse Activities</a></li>
    <li><a href="#" onclick="AUTH.logout()"><span class="nav-icon">🚪</span>Logout</a></li>
  </ul>
</div>

<main style="padding-top: 0">
  <div class="opt-b-header animate-fade">
    <div class="opt-b-avatar-wrapper" id="banner-avatar"></div>
    <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; color:var(--text)" id="banner-name">Loading...</h1>
    <p style="color: var(--text-secondary); font-size: 1.1rem" id="banner-dept">Student</p>
    <div style="margin-top:24px; display:flex; justify-content:center; gap:16px">
      <button class="btn btn-outline btn-neumorphic" style="border-radius:100px; padding:10px 24px" onclick="toggleEditProfile()">✏️ Edit Profile</button>
      <a href="/activities/" class="btn btn-primary btn-neumorphic" style="border-radius:100px; padding:10px 24px">📋 Browse Activities</a>
      <button class="btn btn-danger btn-neumorphic" style="border-radius:100px; padding:10px 24px" onclick="AUTH.logout()">🚪 Logout</button>
    </div>
  </div>

  <div class="opt-b-container">
    
    <!-- Left Column: Main Content -->
    <div>
      <!-- Stats -->
      <div class="stat-grid grid mb-32" id="stats-grid"></div>

      <!-- My Enrollments -->
      <div class="opt-b-card animate-slide" style="padding:0; overflow:hidden">
        <div style="padding:32px 32px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,0,0,0.05)">
          <h3 class="section-title" style="margin:0">My Enrollments <span class="badge badge-ghost" id="enroll-count-badge" style="margin-left:12px">0</span></h3>
          <div class="search-input-wrap" style="width:250px"><span class="search-icon">🔍</span><input type="text" id="my-enroll-search" placeholder="Search..." style="border-radius:100px; background:transparent; padding:8px 16px 8px 36px; border:none; box-shadow:inset 4px 4px 8px rgb(163,177,198,0.4), inset -4px -4px 8px rgba(255,255,255, 0.5); width:100%"/></div>
          <input type="hidden" id="my-enroll-status" value="all"/>
        </div>
        <div class="table-wrapper" style="border:none; box-shadow:none; padding:16px 32px">
          <table style="margin:0">
            <thead style="background:transparent"><tr><th style="padding-left:0">Activity</th><th>Category</th><th>Date</th><th>Venue</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="my-enrolls-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="my-enrolls-pg" style="padding:20px 32px; border-top:1px solid rgba(0,0,0,0.05)"></div>
      </div>
    </div>

    <!-- Upcoming Deadlines -->
    <div class="opt-b-card mt-32 animate-slide" style="animation-delay: 0.1s;">
      <h3 class="section-title" style="margin-bottom:0; color:var(--text-primary)">⏰ Deadlines</h3>
      <div id="deadlines-list" style="margin-top:24px; display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;"></div>
    </div>
    
  </div>
</main>

<!-- Edit Profile Modal -->
<div class="modal-overlay hidden" id="edit-profile-modal">
  <div class="modal opt-b-card" style="padding:32px; max-width:600px; width:100%">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
      <h3 class="section-title" style="margin:0">Edit Profile</h3>
      <button class="btn btn-neumorphic" onclick="toggleEditProfile()" style="padding:8px 14px; border-radius:50%">✕</button>
    </div>
    <form id="profile-form" novalidate>
      <div class="form-group"><label class="form-label" style="color:var(--text-secondary)" for="p-name">Full Name *</label><input type="text" class="form-control" id="p-name"/><span class="form-error" id="p-name-error"></span></div>
      <div class="form-group"><label class="form-label" style="color:var(--text-secondary)" for="p-phone">Phone</label><input type="tel" class="form-control" id="p-phone" placeholder="10-digit number" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')"/><span class="form-error" id="p-phone-error"></span></div>
      <div class="form-group"><label class="form-label" style="color:var(--text-secondary)" for="p-dept">Department</label>
        <select class="form-control" id="p-dept">
          <option style="background:var(--neu-bg); color:var(--text-primary)">Computer Science</option><option style="background:var(--neu-bg); color:var(--text-primary)">Electronics</option><option style="background:var(--neu-bg); color:var(--text-primary)">Mechanical</option><option style="background:var(--neu-bg); color:var(--text-primary)">Civil</option><option style="background:var(--neu-bg); color:var(--text-primary)">Electrical</option><option style="background:var(--neu-bg); color:var(--text-primary)">Information Technology</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label" style="color:var(--text-secondary)" for="p-studentid">ID</label><input type="text" class="form-control" id="p-studentid"/></div>
      
      <!-- Profile Photo Feature -->
      <div class="form-group" style="margin-bottom:24px">
        <label class="form-label" style="color:var(--text-secondary)" for="p-photo">Profile Photo</label>
        <input type="file" id="p-photo" accept="image/*" class="form-control" style="padding:10px" />
        <small style="color:var(--text-muted); display:block; margin-top:6px">Max 2MB.</small>
      </div>

      <div style="display:flex;gap:12px; border-top:1px solid var(--neu-shadow-lgt); padding-top:20px; margin-top:24px;">
        <button type="submit" class="btn btn-success btn-neumorphic" style="padding:12px 16px; flex:1">Save Changes</button>
        <button type="button" class="btn btn-ghost btn-neumorphic" onclick="toggleEditProfile()" style="padding:12px 16px; flex:1">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Unenroll Modal -->
<div class="modal-overlay hidden" id="unenroll-modal">
  <div class="modal opt-b-card" style="max-width:400px; padding:32px">
    <div class="modal-header" style="border-bottom:none; margin-bottom:12px;"><div class="modal-title" style="color:var(--text-primary)">⚠️ Cancel Enrollment?</div><button class="btn btn-neumorphic" onclick="document.getElementById('unenroll-modal').classList.add('hidden')" style="padding:6px 12px; border-radius:50%">✕</button></div>
    <p style="color:var(--text-secondary);margin-bottom:24px; line-height: 1.6" id="unenroll-msg"></p>
    <div style="display:flex;gap:12px">
      <button class="btn btn-danger btn-neumorphic" id="confirm-unenroll" style="flex:1">Cancel Enrollment</button>
      <button class="btn btn-ghost btn-neumorphic" onclick="document.getElementById('unenroll-modal').classList.add('hidden')" style="flex:1">Keep</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const PER = 6; let enrollPage = 1;
let unenrollTarget = null;
let uploadedProfilePhoto = null;

document.addEventListener('DOMContentLoaded', async () => {
  AUTH.requireAuth(['student']);
  UI.initNavbar(); UI.initMobileDrawer();
  
  const sess = AUTH.getSession();
  const user = AUTH.getCurrentUser() || sess;
  const initials = sess.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();

  document.getElementById('banner-name').textContent = sess.name;
  document.getElementById('banner-dept').textContent = user.dept ? `${user.dept} · Student` : 'Student';
  
  uploadedProfilePhoto = user.profilePhoto || null;
  document.getElementById('banner-avatar').innerHTML = uploadedProfilePhoto ? `<img src="${uploadedProfilePhoto}"/>` : initials;
  
  const pPhoto = document.getElementById('p-photo');
  if (pPhoto) {
    pPhoto.addEventListener('change', function(e) {
      const file = this.files[0];
      if (file) {
        if (file.size > 2 * 1024 * 1024) { UI.toast('Image too large (Max 2MB)','error'); return; }
        const r = new FileReader();
        r.onload = ev => { uploadedProfilePhoto = ev.target.result; };
        r.readAsDataURL(file);
      }
    });
  }

  await renderStats(); await renderEnrollments(); await renderDeadlines();
  document.getElementById('my-enroll-search').addEventListener('input', debounce(()=>{enrollPage=1;renderEnrollments();},300));
});

function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

async function renderStats() {
  const sess = AUTH.getSession();
  const allEnrolls = await APP.getEnrollments();
  const enrolls = allEnrolls.filter(e => e.studentId === sess.userId);
  const activities = await APP.getActivities();
  const allApproved = activities.filter(a=>a.status==='approved').length;
  const upcoming = enrolls.filter(e=>{const act=activities.find(a=>a.id===e.activityId);return act&&new Date(act.date)>new Date();});
  const icons = {
    ticket: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>`,
    calendar: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    list: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
    check: `<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
  };
  document.getElementById('stats-grid').innerHTML=[
    {icon:icons.ticket,val:enrolls.length,label:'My Enrollments'},
    {icon:icons.calendar,val:upcoming.length,label:'Upcoming Events'},
    {icon:icons.list,val:allApproved,label:'Available Activities'},
    {icon:icons.check,val:enrolls.filter(e=>e.status==='confirmed').length,label:'Confirmed'},
  ].map(d=>`<div class="stat-card"><div class="stat-icon" style="color:var(--primary); background:transparent !important; box-shadow:none !important">${d.icon}</div><div><div class="stat-value">${d.val}</div><div class="stat-label">${d.label}</div></div></div>`).join('');
}

function toggleEditProfile() {
  const modal = document.getElementById('edit-profile-modal');
  const user = AUTH.getCurrentUser();
  if (modal.classList.contains('hidden')) {
    document.getElementById('p-name').value = user.name;
    document.getElementById('p-phone').value = user.phone||'';
    document.getElementById('p-dept').value = user.dept||'';
    document.getElementById('p-studentid').value = user.studentId||'';
    modal.classList.remove('hidden');
  } else { modal.classList.add('hidden'); }
}

document.getElementById('profile-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const sess = AUTH.getSession();
  const name = document.getElementById('p-name').value.trim();
  const phone = document.getElementById('p-phone').value.trim();
  if (!name || name.length < 2) { UI.setFieldError('p-name','Name must be at least 2 characters.'); return; } else UI.setFieldValid('p-name');
  if (phone && !AUTH.isValidPhone(phone)) { UI.setFieldError('p-phone','Enter a valid 10-digit number.'); return; } else UI.setFieldValid('p-phone');
  
  // Note: updateUser in this simple app handles local session caching only for missing backend
  sess.name = name;
  sess.dept = document.getElementById('p-dept').value;
  sess.profilePhoto = uploadedProfilePhoto;
  sessionStorage.setItem('cams_session', JSON.stringify(sess));
  localStorage.setItem('cams_session', JSON.stringify(sess));

  UI.toast('Profile updated successfully!','success');
  setTimeout(()=>window.location.reload(), 600);
});

async function renderEnrollments() {
  const sess = AUTH.getSession();
  const q = document.getElementById('my-enroll-search').value.toLowerCase();
  const status = document.getElementById('my-enroll-status').value;
  const allEnrolls = await APP.getEnrollments();
  let enrolls = allEnrolls.filter(e => e.studentId === sess.userId);
  if (q) enrolls = enrolls.filter(e=>e.activityTitle.toLowerCase().includes(q));
  if (status!=='all') enrolls = enrolls.filter(e=>e.status===status);
  document.getElementById('enroll-count-badge').textContent = enrolls.length + ' enrollments';
  const {data, totalPages} = APP.paginate(enrolls, enrollPage, PER);
  const tb = document.getElementById('my-enrolls-tbody');
  if (!data.length) { tb.innerHTML=`<tr><td colspan="6"><div class="empty-state" style="padding:24px"><div class="empty-icon">🎟️</div><h3>No enrollments yet</h3><p><a href="/activities/" class="btn btn-primary btn-neumorphic" style="margin-top:8px">Browse Activities</a></p></div></td></tr>`; document.getElementById('my-enrolls-pg').innerHTML=''; return; }
  
  const activities = await APP.getActivities();
  tb.innerHTML = data.map(e=>{
    const act = activities.find(a=>a.id === e.activityId);
    const cats={sports:'🏃',cultural:'🎭',technical:'💻',academic:'📚'};
    let canCancel = true;
    if (act && act.deadline) {
      const d = new Date(act.deadline); d.setHours(23,59,59,999);
      if (new Date() > d) canCancel = false;
    }
    return `<tr>
      <td>${e.activityTitle}</td>
      <td>${act?`<span class="badge badge-info">${cats[act.category]||''} ${act.category}</span>`:'—'}</td>
      <td>${act?UI.formatDate(act.date):'—'}</td>
      <td>${act?act.venue:'—'}</td>
      <td><span class="badge badge-${e.status==='confirmed'?'success':e.status==='pending'?'warning':'error'}">${e.status}</span></td>
      <td>${canCancel ? `<button class="btn btn-danger btn-neumorphic btn-sm" onclick="askUnenroll('${e.activityId}','${e.activityTitle.replace(/'/g,'')}','${e.id}')" style="padding:4px 10px">✕ Cancel</button>` : `<span style="font-size:0.8rem;color:var(--text-muted)">Closed</span>`}</td>
    </tr>`;
  }).join('');
  renderPg('my-enrolls-pg', totalPages, enrollPage, async p=>{enrollPage=p;await renderEnrollments();});
}

async function renderDeadlines() {
  const sess = AUTH.getSession();
  const allEnrolls = await APP.getEnrollments();
  const enrolls = allEnrolls.filter(e => e.studentId === sess.userId);
  const activities = await APP.getActivities();
  const upcoming = enrolls.map(e=>{const a=activities.find(x=>x.id===e.activityId);return a?{...a,enrolled:true}:null;}).filter(a=>a&&new Date(a.date)>new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,4);
  const el = document.getElementById('deadlines-list');
  if (!upcoming.length) { el.innerHTML=`<div style="font-size:.85rem;color:var(--text-muted);padding:12px 0">No upcoming activities from your enrollments.</div>`; return; }
  el.innerHTML = upcoming.map(a=>`
    <div style="padding:16px; border-radius:12px; box-shadow: inset 4px 4px 8px var(--neu-shadow-drk), inset -4px -4px 8px var(--neu-shadow-lgt); background: var(--neu-bg); display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="width:12px;height:12px;border-radius:50%;background:var(--primary);flex-shrink:0; box-shadow: 0 0 10px var(--primary)"></div>
        <div><div style="font-weight:700;font-size:1rem;color:var(--text-primary)">${a.title}</div><div style="font-size:.8rem;color:var(--text-muted);margin-top:2px">📍 ${a.venue}</div></div>
      </div>
      <div style="text-align:right;flex-shrink:0"><div style="font-weight:800;font-size:.95rem;color:var(--primary)">${UI.formatDate(a.date)}</div><div style="font-size:.75rem;color:var(--text-muted);margin-top:2px">Due: ${UI.formatDate(a.deadline)}</div></div>
    </div>`).join('');
}

function renderPg(id, total, current, onPage) {
  const pg=document.getElementById(id);
  if(total<=1){pg.innerHTML='';return;}
  let html=`<button class="page-btn btn-neumorphic" onclick="(${onPage.toString()})(${current-1})" ${current===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=total;i++){if(i===1||i===total||Math.abs(i-current)<=1)html+=`<button class="page-btn btn-neumorphic ${i===current?'active':''}" onclick="(${onPage.toString()})(${i})">${i}</button>`;else if(Math.abs(i-current)===2)html+=`<span class="page-btn" style="cursor:default;opacity:.5;border:none;box-shadow:none;background:transparent">…</span>`;}
  html+=`<button class="page-btn btn-neumorphic" onclick="(${onPage.toString()})(${current+1})" ${current===total?'disabled':''}>›</button><span class="page-info" style="color:var(--text-muted)">Page ${current} of ${total}</span>`;
  pg.innerHTML=html;
}

let unenrollId = null;
function askUnenroll(actId, title, enrId) {
  unenrollTarget = actId;
  unenrollId = enrId;
  document.getElementById('unenroll-msg').textContent = `Are you sure you want to cancel your enrollment in "${title}"?`;
  document.getElementById('unenroll-modal').classList.remove('hidden');
}
document.getElementById('confirm-unenroll').onclick = async () => {
  if (!unenrollTarget) return;
  const sess = AUTH.getSession();
  await APP.unenrollStudent(unenrollTarget, sess.userId, unenrollId);
  UI.toast('Enrollment cancelled.','warning');
  document.getElementById('unenroll-modal').classList.add('hidden');
  unenrollTarget = null;
  await renderStats(); await renderEnrollments(); await renderDeadlines();
};
</script>
</body>
</html>
