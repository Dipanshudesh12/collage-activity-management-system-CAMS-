{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Edit Activity</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/neumorphism.css' %}">

</head>

<body>

<div class="container" style="padding:40px">

    <div class="card" style="max-width:700px;margin:auto">

        <h1 class="page-title">
            ✏ Edit Activity
        </h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Title</label>

                <input
                  type="text"
                  name="title"
                  class="form-control"
                  value="{{ activity.title }}"
                >

            </div>

            <div class="form-group">

                <label>Category</label>

                <input
                  type="text"
                  name="category"
                  class="form-control"
                  value="{{ activity.category }}"
                >

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                  name="desc"
                  class="form-control"
                >{{ activity.desc }}</textarea>

            </div>

            <div class="form-group">

                <label>Date</label>

                <input
                  type="date"
                  name="date"
                  class="form-control"
                  value="{{ activity.date|date:'Y-m-d' }}"
                >

            </div>

            <div class="form-group">

                <label>Venue</label>

                <input
                  type="text"
                  name="venue"
                  class="form-control"
                  value="{{ activity.venue }}"
                >

            </div>

            <button
              type="submit"
              class="btn btn-primary"
            >
                Save Changes
            </button>

        </form>

    </div>

</div>

</body>

</html>
